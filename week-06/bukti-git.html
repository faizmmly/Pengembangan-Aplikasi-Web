<main class="wrap">
  <a class="back" href="index.html">← Kembali ke Week 06</a>
  <h1>Bukti Penggunaan Git dan GitHub</h1>
  <p class="sub">Repository: <a href="https://github.com/faizmmly/pengelola-daftar-tugas-kuliah" target="_blank" rel="noopener noreferrer">github.com/faizmmly/pengelola-daftar-tugas-kuliah</a></p>

  <figure>
    <img src="img/branch.png" alt="Daftar branch di GitHub" loading="lazy">
    <figcaption><strong>1. Branch</strong>Daftar branch fitur yang dibuat terpisah dari <code>main</code>.</figcaption>
  </figure>
  <figure>
    <img src="img/pull-request.png" alt="Daftar Pull Request yang sudah di-merge" loading="lazy">
    <figcaption><strong>2. Pull Request</strong>Pull Request yang sudah berstatus Merged.</figcaption>
  </figure>
  <figure>
    <img src="img/merge-graph.png" alt="Riwayat commit dan merge dengan git log graph" loading="lazy">
    <figcaption><strong>3. Merge</strong>Riwayat commit dan penggabungan branch (<code>git log --graph</code>).</figcaption>
  </figure>
  <figure>
    <img src="img/conflict-terminal.jpeg" alt="Terminal menampilkan CONFLICT saat merge" loading="lazy">
    <figcaption><strong>4. Conflict: terminal</strong>Git melaporkan conflict di <code>components.css</code> saat merge.</figcaption>
  </figure>
  <figure>
    <img src="img/conflict-editor.jpeg" alt="Editor menampilkan penanda conflict" loading="lazy">
    <figcaption><strong>5. Conflict: editor</strong>Penanda <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code> pada baris yang sama di dua branch.</figcaption>
  </figure>
  <figure>
    <img src="img/conflict-selesai.png" alt="Conflict sudah diselesaikan dan di-commit" loading="lazy">
    <figcaption><strong>6. Conflict: selesai</strong>Satu versi dipilih, penanda dihapus, lalu di-commit sebagai merge.</figcaption>
  </figure>
