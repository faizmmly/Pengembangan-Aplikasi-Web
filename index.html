<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Praktikum - Pengembangan Aplikasi Web</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header Section -->
  <header class="border-b border-slate-800 bg-slate-950/70 py-16">
    <div class="max-w-7xl mx-auto px-8 text-center">
      <span class="badge-tag">Portal Praktikum</span>
      <h1 class="text-4xl sm:text-5xl font-extrabold text-white mt-5 tracking-tight">
        Pengembangan Aplikasi Web
      </h1>
      <p class="text-slate-400 mt-3 text-lg sm:text-xl max-w-2xl mx-auto">
        Kumpulan rekapitulasi tugas dan dokumentasi praktikum mingguan (Week 01 - 16).
      </p>
      <p>Faiz Muhammad Ilham Hariry</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-8 py-12 flex-1 w-full">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
      <h2 class="text-2xl font-bold text-white flex items-center gap-3">
        <i data-lucide="folder-git-2" class="text-cyan-400 w-7 h-7"></i> Daftar Pertemuan
      </h2>
      <span class="text-sm font-medium text-slate-400 bg-slate-800 px-3 py-1 rounded-md border border-slate-700">Semester 5</span>
    </div>

    <!-- Grid Container Lebih Lebar -->
    <div id="weeks-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      <!-- Card items dari JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 bg-slate-950 py-8">
    <div class="max-w-7xl mx-auto px-8 text-center text-sm text-slate-500">
      <p>Pengembangan Aplikasi Web &copy; 2026</p>
    </div>
  </footer>

  <!-- Custom JavaScript -->
  <script src="js/main.js"></script>
</body>
</html>
